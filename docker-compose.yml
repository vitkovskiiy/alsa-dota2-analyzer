services:
  postgres:
    image: postgres:16
    container_name: alsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alsa
      POSTGRES_PASSWORD: alsa
      POSTGRES_DB: alsa_db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsa -d alsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
